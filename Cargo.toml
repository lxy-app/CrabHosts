[workspace]
members = ["crates/core", "crates/cli", "apps/desktop"]
default-members = ["crates/core", "crates/cli", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["CrabHosts contributors"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18"] }
slint-build = "1.18"
tempfile = "3.23"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
